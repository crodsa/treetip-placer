[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treetip-placer"
version = "0.6.6"
description = "Quality-controlled placement of fixed-column FASTA alignments on a reference tree."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary: all rights reserved; research/development only"}
authors = [{name = "TreeTip Placer contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
treetip = "treetip_placer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
