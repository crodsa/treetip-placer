[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treetip-placer"
version = "0.7.0"
description = "Quality-controlled placement of fixed-column FASTA alignments on a reference tree."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TreeTip Placer contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/crodsa/treetip-placer"
Source = "https://github.com/crodsa/treetip-placer"
Issues = "https://github.com/crodsa/treetip-placer/issues"

[project.optional-dependencies]
dev = ["ruff==0.16.10"]

[project.scripts]
treetip = "treetip_placer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
