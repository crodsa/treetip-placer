[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treetip-placer"
version = "1.0.0"
description = "Quality-controlled placement of fixed-column FASTA alignments on a reference tree."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "César Rodríguez"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/crodsa/treetip-placer"
Source = "https://github.com/crodsa/treetip-placer"
Issues = "https://github.com/crodsa/treetip-placer/issues"

[project.optional-dependencies]
dev = ["ruff==0.15.22"]

[project.scripts]
treetip = "treetip_placer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/treetip-placer" = [
    "environment.yml",
]
"share/treetip-placer/reference-packages/mlst-cdifficile-20260806" = [
    "reference-packages/mlst-cdifficile-20260806/LICENSE",
    "reference-packages/mlst-cdifficile-20260806/README.md",
    "reference-packages/mlst-cdifficile-20260806/paired_reference.json",
]
"share/treetip-placer/reference-packages/mlst-cdifficile-20260806/classical" = [
    "reference-packages/mlst-cdifficile-20260806/classical/aligned.fasta",
    "reference-packages/mlst-cdifficile-20260806/classical/tip_clades.tsv",
    "reference-packages/mlst-cdifficile-20260806/classical/tree.nwk",
]
"share/treetip-placer/reference-packages/mlst-cdifficile-20260806/cryptic" = [
    "reference-packages/mlst-cdifficile-20260806/cryptic/aligned.fasta",
    "reference-packages/mlst-cdifficile-20260806/cryptic/tip_clades.tsv",
    "reference-packages/mlst-cdifficile-20260806/cryptic/tree.nwk",
]

[tool.unittest]
start-directory = "tests"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
