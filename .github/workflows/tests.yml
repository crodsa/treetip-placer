name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development checks
        run: python -m pip install '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI smoke placement
        run: >-
          python -c "from pathlib import Path; from treetip_placer.cli import main; output = Path('ci-smoke'); exit_code = main(['place', '--tree', 'tests/fixtures/tree.nwk', '--reference-alignment', 'tests/fixtures/reference_alignment_full.fasta', '--query-alignment', 'tests/fixtures/query_alignment_full.fasta', '--output', str(output), '--preset', 'thorough', '--threads', '2', '--unresolved-weight', '0', '--min-comparable-sites', '2']); assert exit_code == 0; assert (output / 'trees' / 'placed_tree.nwk').is_file()"
