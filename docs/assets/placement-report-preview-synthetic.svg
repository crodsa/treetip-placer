<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic TreeTip Placer report layout</title>
  <desc id="desc">Two complementary report views: a global clade context without reference identifiers and a local placement branch with named neighbouring references.</desc>
  <style>
    .title { font: 700 30px system-ui, sans-serif; fill: #102a43; } .heading { font: 700 18px system-ui, sans-serif; fill: #102a43; } .copy { font: 14px system-ui, sans-serif; fill: #334155; } .branch { fill: none; stroke: #64748b; stroke-width: 2; } .placement { fill: none; stroke: #2563eb; stroke-width: 5; } .clade { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; } .focus { fill: #fed7aa; stroke: #c2410c; stroke-width: 2; } .label { font: 13px system-ui, sans-serif; fill: #1e3a8a; } .query { font: 700 13px system-ui, sans-serif; fill: #9a3412; } .tip { font: 13px system-ui, sans-serif; fill: #334155; }
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="42" y="54">Automatic classical/cryptic panel placement report</text>
  <text class="copy" x="42" y="82">Synthetic layout preview. TSV, JSON, Newick, Nexus, and JPlace sidecars remain authoritative.</text>
  <rect x="36" y="110" width="1128" height="278" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text class="heading" x="58" y="142">demo_query global clade context — zoom out</text>
  <text class="copy" x="58" y="166">All reference-only subtrees are collapsed. Reference-tip identifiers are omitted.</text>
  <path class="branch" d="M80 275H235M235 202V345M235 202H425M235 275H425M235 345H425M425 202V230M425 202H575M425 230H575M425 275V305M425 275H575M425 305H575M425 345H575"/>
  <rect class="clade" x="575" y="188" width="170" height="28" rx="5"/><text class="label" x="586" y="207">C-I (19 tips)</text>
  <rect class="clade" x="575" y="216" width="170" height="28" rx="5"/><text class="label" x="586" y="235">C-III (30 tips)</text>
  <rect class="clade" x="575" y="261" width="170" height="28" rx="5"/><text class="label" x="586" y="280">C-IV (2 tips)</text>
  <path class="branch" d="M575 305H730M730 290V320M730 290H890M730 320H890"/>
  <rect class="focus" x="890" y="276" width="150" height="28" rx="5"/><text class="query" x="902" y="295">demo_query</text>
  <rect class="clade" x="890" y="308" width="150" height="28" rx="5"/><text class="label" x="902" y="327">C-II (10 tips)</text>
  <rect class="clade" x="575" y="331" width="170" height="28" rx="5"/><text class="label" x="586" y="350">Mixed (7 tips)</text>
  <rect x="36" y="416" width="1128" height="278" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
  <text class="heading" x="58" y="448">demo_query placement branch — zoom in</text>
  <text class="copy" x="58" y="472">Topology-derived local subtree. Blue indicates the query attachment branch; visible neighbours keep their names.</text>
  <path class="branch" d="M80 580H315M315 520V646M315 520H590M315 580H590M315 646H590M590 520V548M590 520H840M590 548H840M590 580V610M590 580H840M590 610H840M590 646H840"/>
  <text class="tip" x="850" y="524">ST_001</text><text class="tip" x="850" y="552">ST_017</text><text class="tip" x="850" y="584">ST_052</text>
  <path class="placement" d="M590 610H840"/><circle cx="840" cy="610" r="6" fill="#ea580c"/><text class="query" x="853" y="615">demo_query</text>
  <text class="tip" x="850" y="650">… (42 tips)</text>
  <text class="copy" x="42" y="730">The figures are display-only and do not modify the fixed reference tree, placement, QC, or clade call.</text>
</svg>
